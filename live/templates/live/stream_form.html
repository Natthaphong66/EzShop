{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-slate-900 mb-8">เริ่มไลฟ์สตรีมใหม่</h1>

    <form method="post" class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
        {% csrf_token %}
        
        <div class="mb-6">
            <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">
                หัวข้อ
            </label>
            {{ form.title }}
            {% if form.title.errors %}
            <p class="text-red-600 text-sm mt-1">{{ form.title.errors.0 }}</p>
            {% endif %}
        </div>

        <div class="mb-6">
            <label for="{{ form.description.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">
                คำอธิบาย
            </label>
            {{ form.description }}
            {% if form.description.errors %}
            <p class="text-red-600 text-sm mt-1">{{ form.description.errors.0 }}</p>
            {% endif %}
        </div>

        <div class="flex gap-4">
            <button type="submit" 
                    class="flex-1 px-6 py-3 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors">
                เริ่มไลฟ์
            </button>
            <a href="{% url 'live:stream_list' %}" 
               class="px-6 py-3 bg-slate-200 text-slate-700 font-semibold rounded-lg hover:bg-slate-300 transition-colors">
                ยกเลิก
            </a>
        </div>
    </form>
</div>
{% endblock %}
