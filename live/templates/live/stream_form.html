{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-slate-900 mb-6">เริ่มไลฟ์สตรีมใหม่</h1>
    
    <form method="post" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">
                ชื่อไลฟ์สตรีม
            </label>
            {{ form.title }}
            {% if form.title.errors %}
            <p class="text-red-600 text-sm mt-1">{{ form.title.errors.0 }}</p>
            {% endif %}
        </div>
        
        <div class="mb-6">
            <label for="{{ form.description.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">
                คำอธิบาย
            </label>
            {{ form.description }}
            {% if form.description.errors %}
            <p class="text-red-600 text-sm mt-1">{{ form.description.errors.0 }}</p>
            {% endif %}
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="px-6 py-2 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg font-semibold hover:bg-red-700 transition-colors">
                เริ่มไลฟ์
            </button>
            <a href="{% url 'live:stream_list' %}" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-lg font-semibold hover:bg-slate-300 transition-colors">
                ยกเลิก
            </a>
        </div>
    </form>
</div>

<style>
#id_title {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    font-size: 1rem;
}

#id_title:focus {
    outline: none;
    border-color: #ef4444;
    ring: 2px;
    ring-color: #ef4444;
}

#id_description {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    font-size: 1rem;
    min-height: 120px;
    resize: vertical;
}

#id_description:focus {
    outline: none;
    border-color: #ef4444;
    ring: 2px;
    ring-color: #ef4444;
}
</style>
{% endblock %}
