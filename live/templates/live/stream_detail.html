{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>{{ stream.title }}</title>

    <!-- Agora SDK -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.21.0.js"></script>

    <style>
        /* ===== Live Video Layout ===== */
        #agora-live-container {
            width: 100%;
            min-height: 480px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #local-player {
            width: 100%;
            height: 480px;
            position: relative;
            background: #000;
        }

        /* สำคัญมาก: บังคับขนาด video */
        #local-player video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            background: #000;
        }

        .live-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .live-controls button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>{{ stream.title }}</h2>

    <div id="agora-live-container">
        <div id="local-player"></div>

        {% if user == stream.host %}
        <div class="live-controls">
            <button onclick="toggleCamera()">📷 เปิด/ปิดกล้อง</button>
            <button onclick="toggleMic()">🎤 เปิด/ปิดไมค์</button>
        </div>
        {% endif %}
    </div>

    <!-- ===== Agora Script ===== -->
    <script>
        /* ===============================
           Initial Variables (SAFE)
        ================================ */
        const isHost = {% if user == stream.host %}true{% else %} false{% endif %};
        const channelName = "{{ stream.channel_name|escapejs }}";
        const userUid = "{% if user.is_authenticated %}{{ user.id }}{% else %}guest{% endif %}";
        // ✅ CSRF token ต้องประกาศก่อนใช้งาน
        const csrfToken = "{{ csrf_token }}";

        console.log("Init:", { isHost, channelName, userUid });

        /* ===============================
           Agora Global State
        ================================ */
        let client = null;
        let localTracks = {
            videoTrack: null,
            audioTrack: null
        };

        /* ===============================
           Utils
        ================================ */
        async function getDroidCamDeviceId() {
            const cameras = await AgoraRTC.getCameras();
            console.log("Available cameras:", cameras);

            const cam = cameras.find(c =>
                c.label && c.label.toLowerCase().includes("droidcam")
            );

            if (!cam) {
                throw new Error("❌ ไม่พบ DroidCam กรุณาเปิด DroidCam ก่อน");
            }

            console.log("🎥 Using camera:", cam.label);
            return cam.deviceId;
        }

        async function fetchAgoraToken() {
            const res = await fetch("/live/api/token/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({
                    channel_name: channelName,
                    uid: userUid,
                    role: isHost ? 1 : 2
                })
            });


            if (!res.ok) {
                throw new Error("Token API error");
            }

            return res.json();
        }

        /* ===============================
           Init Agora
        ================================ */
        async function initAgora() {
            console.log("🔥 initAgora START");

            const tokenData = await fetchAgoraToken();

            client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

            await client.join(
                tokenData.app_id,
                channelName,
                tokenData.token,
                userUid
            );

            console.log("✅ Joined channel");

            if (isHost) {
                const cameraId = await getDroidCamDeviceId();

                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack({
                    cameraId,
                    encoderConfig: "480p_1"
                });

                await client.publish([
                    localTracks.audioTrack,
                    localTracks.videoTrack
                ]);

                console.log("📡 Published tracks");

                localTracks.videoTrack.play("local-player");
            }
        }

        /* ===============================
           Controls
        ================================ */
        function toggleCamera() {
            if (localTracks.videoTrack) {
                const enabled = localTracks.videoTrack.isEnabled;
                localTracks.videoTrack.setEnabled(!enabled);
            }
        }

        function toggleMic() {
            if (localTracks.audioTrack) {
                const enabled = localTracks.audioTrack.isEnabled;
                localTracks.audioTrack.setEnabled(!enabled);
            }
        }

        /* ===============================
           Start
        ================================ */
        window.addEventListener("load", () => {
            initAgora().catch(err => {
                console.error("❌ Agora error:", err);
                alert(err.message);
            });
        });
    </script>

</body>

</html>
