{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <!-- Success Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-medium text-slate-900 mb-2">รีเซ็ตรหัสผ่านสำเร็จ</h1>
                <p class="text-slate-600">รหัสผ่านของคุณได้รับการตั้งใหม่แล้ว</p>
            </div>

            <!-- Login Button -->
            <div class="text-center">
                <a href="{% url 'accounts:login' %}"
                    class="inline-block w-full px-4 py-3 bg-slate-900 text-white font-medium rounded-lg hover:bg-black transition-colors">
                    เข้าสู่ระบบ
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
