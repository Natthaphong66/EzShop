{% extends "base.html" %}

{% block content %}
<div class="w-full px-4 py-8 mt-2">
    <div class="flex gap-8 max-w-7xl mx-auto">
        <!-- Sidebar -->
        <aside class="w-64 flex-shrink-0">
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 sticky top-4">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">จัดการบัญชี</h3>
                <nav class="space-y-1">
                    <a href="{% url 'accounts:profile' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors {% if request.resolver_match.url_name == 'profile' %}bg-blue-50 text-blue-600 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <span>หน้าโปรไฟล์</span>
                    </a>
                    <a href="{% url 'accounts:profile_update' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors {% if request.resolver_match.url_name == 'profile_update' %}bg-blue-50 text-blue-600 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        <span>แก้ไขข้อมูลส่วนตัว</span>
                    </a>
                    <a href="{% url 'accounts:password_change' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors {% if request.resolver_match.url_name == 'password_change' %}bg-blue-50 text-blue-600 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                        </svg>
                        <span>เปลี่ยนรหัสผ่าน</span>
                    </a>
                    <a href="{% url 'orders:my_orders' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors {% if 'orders' in request.path %}bg-blue-50 text-blue-600 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        <span>คำสั่งซื้อ</span>
                    </a>
                    <a href="{% url 'orders:my_sales' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors {% if 'my-sales' in request.path %}bg-blue-50 text-blue-600 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>รายการขาย</span>
                    </a>
                    <a href="{% url 'accounts:profile_delete' %}"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-red-600 hover:bg-red-50 transition-colors {% if request.resolver_match.url_name == 'profile_delete' %}bg-red-50 font-medium{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span>ลบบัญชี</span>
                    </a>

                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0">
            {% block account_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
