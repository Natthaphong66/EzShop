{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <!-- Success Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-medium text-slate-900 mb-2">ส่งลิงก์รีเซ็ตแล้ว</h1>
                <p class="text-slate-600">ตรวจสอบอีเมลของคุณเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
                <p class="text-sm text-slate-500 mt-2">(อาจใช้เวลาสักครู่)</p>
            </div>

            <!-- Link to Home -->
            <div class="text-center">
                <a href="{% url 'home' %}"
                    class="inline-block px-6 py-2 text-slate-600 hover:text-slate-900 transition-colors">
                    กลับหน้าหลัก
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
