{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-medium text-slate-900 mb-2">รีเซ็ตรหัสผ่าน</h1>
                <p class="text-slate-500">ป้อนอีเมลของคุณเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
            </div>

            <!-- Form -->
            <form method="post">
                {% csrf_token %}

                <!-- Email Field -->
                <div class="mb-6">
                    <label for="{{ form.email.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-2">
                        อีเมล
                    </label>

                    {{ form.email }}

                    {% if form.email.errors %}
                    <p class="text-red-600 text-sm mt-1">{{ form.email.errors.0 }}</p>
                    {% endif %}
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full px-4 py-3 bg-slate-900 text-white font-medium rounded-lg hover:bg-black transition-colors">
                    ส่งลิงก์รีเซ็ต
                </button>
            </form>

            <!-- Link Back to Login -->
            <div class="mt-6 text-center text-sm pt-4 border-t border-slate-100">
                <a href="{% url 'accounts:login' %}" class="text-slate-600 hover:text-slate-900 transition-colors">
                    ← กลับไปหน้าเข้าสู่ระบบ
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
